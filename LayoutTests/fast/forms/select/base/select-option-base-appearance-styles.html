<!DOCTYPE html><!-- webkit-test-runner [ HTMLEnhancedSelectMultipleAndListBoxEnabled=true ] -->
<html>
<head>
<script src="../../../../resources/js-test.js"></script>
<style>
.base, .base::picker(select) {
    appearance: base-select;
}
</style>
</head>
<body>
<select id="nativeListBoxFirst" size="4"><option>one</option><optgroup label="group"><option>two</option></optgroup></select>
<select id="baseListBoxSecond" class="base" size="4"><option>one</option><optgroup label="group"><option>two</option></optgroup></select>
<select id="baseListBoxFirst" class="base" size="4"><option>one</option><optgroup label="group"><option>two</option></optgroup></select>
<select id="nativeListBoxSecond" size="4"><option>one</option><optgroup label="group"><option>two</option></optgroup></select>
<select id="nativeMultipleFirst" multiple size="1"><option>one</option><optgroup label="group"><option>two</option></optgroup></select>
<select id="baseDropdownSecond" class="base" multiple size="1"><option>one</option><optgroup label="group"><option>two</option></optgroup></select>
<select id="baseDropdownFirst" class="base" multiple size="1"><option>one</option><optgroup label="group"><option>two</option></optgroup></select>
<select id="nativeMultipleSecond" multiple size="1"><option>one</option><optgroup label="group"><option>two</option></optgroup></select>
<select id="nativeDropdownFirst"><option>one</option><optgroup label="group"><option disabled>two</option></optgroup></select>
<select id="baseSingleDropdownSecond" class="base"><option>one</option><optgroup label="group"><option disabled>two</option></optgroup></select>
<select id="baseSingleDropdownFirst" class="base"><option>one</option><optgroup label="group"><option disabled>two</option></optgroup></select>
<select id="nativeDropdownSecond"><option>one</option><optgroup label="group"><option disabled>two</option></optgroup></select>
<script>
description("The option styles of a base appearance select do not apply to a native one, whichever of the two is styled first.");

function optionStyle(select)
{
    return getComputedStyle(select.options[0]);
}

function groupStyle(select)
{
    return getComputedStyle(select.querySelector("optgroup"));
}

for (const id of ["nativeListBoxFirst", "nativeListBoxSecond", "nativeMultipleFirst", "nativeMultipleSecond", "nativeDropdownFirst", "nativeDropdownSecond"]) {
    shouldBeEqualToString(`optionStyle(${id}).display`, "block");
    shouldBeEqualToString(`optionStyle(${id}).paddingInlineStart`, "0px");
    shouldBeEqualToString(`groupStyle(${id}).borderBlockStartStyle`, "none");
}

for (const id of ["baseListBoxFirst", "baseListBoxSecond", "baseDropdownFirst", "baseDropdownSecond", "baseSingleDropdownFirst", "baseSingleDropdownSecond"]) {
    shouldBeEqualToString(`optionStyle(${id}).display`, "flex");
    shouldBeEqualToString(`optionStyle(${id}).alignItems`, "center");
    shouldBeEqualToString(`groupStyle(${id}).borderBlockStartStyle`, "solid");
}

// A disabled option only looks disabled in the base appearance way when its select has base appearance.
for (const id of ["nativeDropdownFirst", "nativeDropdownSecond"])
    shouldNotBe(`getComputedStyle(${id}.options[1]).cursor`, "'not-allowed'");
for (const id of ["baseSingleDropdownFirst", "baseSingleDropdownSecond"])
    shouldBeEqualToString(`getComputedStyle(${id}.options[1]).cursor`, "not-allowed");

// A native option has no checkmark, and should not report one either.
function checkmarkContent(select)
{
    return getComputedStyle(select.options[0], "::checkmark").content;
}
for (const id of ["nativeDropdownFirst", "nativeDropdownSecond", "nativeListBoxFirst"])
    shouldBeFalse(`checkmarkContent(${id}).includes("\u2713")`);
for (const id of ["baseSingleDropdownFirst", "baseListBoxFirst"])
    shouldBeTrue(`checkmarkContent(${id}).includes("\u2713")`);

// A select has an appearance of its own, so one inside a base appearance list box stays native.
const nested = document.createElement("select");
nested.size = 4;
nested.append(new Option("nested"));
baseListBoxFirst.options[0].append(nested);
shouldBeEqualToString("getComputedStyle(nested).appearance", "auto");
shouldBeEqualToString("optionStyle(nested).display", "block");
shouldBeEqualToString("optionStyle(nested).paddingInlineStart", "0px");

// A list box lays out its options itself, so they also need a box, not only these styles.
for (const id of ["baseListBoxFirst", "baseListBoxSecond"])
    shouldBeTrue(`${id}.options[0].offsetHeight > 0`);
</script>
</body>
</html>
